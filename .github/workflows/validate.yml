name: Validate Marketplace Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so platform drift (new runner images, Python patch releases) surfaces without a code change.
    - cron: "17 5 * * 1"

jobs:
  validate:
    name: validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The declared minimum supported release and a current one.
        python: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install jq and yq
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          else
            brew install jq
          fi
          # Install yq (Python version, not the Go one)
          python -m pip install yq --quiet

      - name: Configure Git identity for fixture repositories
        run: |
          git config --global user.name "workflow-ci"
          git config --global user.email "workflow-ci@example.invalid"

      - name: Run validation script
        env:
          VALIDATE_LOGS: ${{ runner.temp }}/validate-logs
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh

      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/validate-logs
          if-no-files-found: ignore
