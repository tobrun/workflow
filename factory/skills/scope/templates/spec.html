<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Spec</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #5b6474;
    --line: #e3e6ec; --accent: #2f6fed; --chosen: #1a7f4b; --rejected: #b3392f;
    --open: #b07a1e; --warn: #b07a1e; --notdoing: #6b5ca5; --flag: #c22f6d;
    --code-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f; --card: #1c222c; --ink: #e8ebf0; --muted: #98a2b3;
      --line: #2a323f; --accent: #6c9cff; --chosen: #4cc38a; --rejected: #ef8a80;
      --open: #e0b35c; --warn: #e0b35c; --notdoing: #b3a5e8; --flag: #f27daa;
      --code-bg: #232b37;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .summary { margin: 12px 0 28px; font-size: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 36px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .card > button { display: flex; width: 100%; align-items: baseline; gap: 10px; padding: 12px 16px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .card > button:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .card .id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); white-space: nowrap; }
  .card .q { font-weight: 600; flex: 1; }
  .card .state { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card .chev { color: var(--muted); transition: transform .15s; }
  .card.openCard .chev { transform: rotate(90deg); }
  .card .body { display: none; padding: 2px 16px 14px; border-top: 1px solid var(--line); }
  .card.openCard .body { display: block; }
  .alt { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .alt:last-child { border-bottom: 0; }
  .alt .mark { width: 1.2em; text-align: center; font-weight: 700; }
  .mark.chosen { color: var(--chosen); } .mark.rejected { color: var(--rejected); } .mark.open { color: var(--open); }
  .alt .because { color: var(--muted); }
  .warn { color: var(--warn); }
  .notdoing { color: var(--notdoing); padding: 7px 0; }
  .flagline { color: var(--flag); padding: 6px 0 0; font-weight: 600; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 5px 0; border-bottom: 1px dashed var(--line); }
  ul.plain li:last-child { border-bottom: 0; }
  .effort { margin: 6px 0 6px 0; padding-left: 14px; border-left: 2px solid var(--line); }
  .effort .etitle { font-weight: 600; }
  .effort .edesc { color: var(--muted); }
  .decEcho { font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .layer { font-family: ui-monospace, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .banner { background: color-mix(in srgb, var(--flag) 10%, var(--card)); border: 1px solid var(--flag); border-radius: 10px; padding: 10px 16px; margin: 0 0 20px; color: var(--flag); font-weight: 600; }
  .overflowx { overflow-x: auto; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// SPEC_DATA_START
const SPEC_DATA = {
  title: "Example Spec",
  planName: "example-plan",
  date: "2026-01-01",
  summary: "Replace this object with the real spec data.",
  decisions: [],
  scope: { overview: "", efforts: [], nonGoals: [], invariants: [], validation: [] },
  changeSets: []
};
// SPEC_DATA_END

// Generic rendering engine. Reads only SPEC_DATA; do not edit below when refreshing data.
const MARKS = { chosen: "✓", rejected: "✗", open: "?" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function altHtml(a) {
  const down = a.downside ? ` <span class="warn">⚠ ${esc(a.downside)}</span>` : "";
  return `<div class="alt"><span class="mark ${esc(a.mark)}">${MARKS[a.mark] || "?"}</span>` +
    `<span>${esc(a.text)} <span class="because">- ${esc(a.because)}</span>${down}</span></div>`;
}

function decisionCard(d) {
  const state = d.status === "not-doing" ? "⊘ not doing" : d.status;
  const flags = (d.flags || []).map(f => `<div class="flagline">⚑ ${esc(f)}</div>`).join("");
  const nd = d.notDoing ? `<div class="notdoing">⊘ ${esc(d.notDoing)}</div>` : "";
  return `<div class="card"><button aria-expanded="false"><span class="id">${esc(d.id)}</span>` +
    `<span class="q">${esc(d.question)}</span><span class="state">${esc(state)}</span><span class="chev">›</span></button>` +
    `<div class="body">${(d.alternatives || []).map(altHtml).join("")}${nd}${flags}</div></div>`;
}

function effortHtml(e) {
  const dec = (e.decisions || []).length ? ` <span class="decEcho">${(e.decisions).map(esc).join(", ")}</span>` : "";
  const kids = (e.children || []).map(effortHtml).join("");
  return `<div class="effort"><span class="etitle">${esc(e.title)}</span>${dec}<div class="edesc">${esc(e.description)}</div>${kids}</div>`;
}

function changeSetCard(c) {
  const items = (c.items || []).map(i => {
    const dec = (i.decisions || []).length ? ` <span class="decEcho">${i.decisions.map(esc).join(", ")}</span>` : "";
    return `<li><code>${esc(i.file)}</code> - ${esc(i.change)}${dec}</li>`;
  }).join("");
  const tests = (c.tests || []).map(t =>
    `<tr><td><span class="layer">${esc(t.layer)}</span></td><td>${esc(t.scenario)}</td></tr>`).join("");
  return `<div class="card"><button aria-expanded="false"><span class="id">${c.n}</span>` +
    `<span class="q">${esc(c.title)}</span><span class="chev">›</span></button>` +
    `<div class="body"><ul class="plain">${items}</ul>` +
    `<div class="overflowx"><table><thead><tr><th>Layer</th><th>Test scenario</th></tr></thead><tbody>${tests}</tbody></table></div></div></div>`;
}

function render() {
  const d = SPEC_DATA;
  const openFlags = (d.decisions || []).flatMap(x => x.flags || []);
  const banner = openFlags.length ? `<div class="banner">⚑ ${openFlags.length} item(s) still waiting on the user - this change plan is not final.</div>` : "";
  const scope = d.scope || {};
  document.getElementById("app").innerHTML = `
    <header>
      <h1>${esc(d.title)}</h1>
      <div class="meta"><span class="mono">.dev/${esc(d.planName)}/spec.md</span> · ${esc(d.date)}</div>
      <p class="summary">${esc(d.summary)}</p>
    </header>
    ${banner}
    <h2>Decisions</h2>
    ${(d.decisions || []).map(decisionCard).join("") || '<p class="meta">None recorded.</p>'}
    <h2>Scope</h2>
    <div class="card openCard"><div class="body" style="display:block">
      <p>${esc(scope.overview)}</p>
      ${(scope.efforts || []).map(effortHtml).join("")}
      ${(scope.nonGoals || []).length ? `<h2>Non-goals</h2><ul class="plain">${scope.nonGoals.map(n => `<li>⊘ ${esc(n)}</li>`).join("")}</ul>` : ""}
      ${(scope.invariants || []).length ? `<h2>Invariants</h2><ul class="plain">${scope.invariants.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${(scope.validation || []).length ? `<h2>Validation</h2><ul class="plain">${scope.validation.map(n => `<li><code>${esc(n)}</code></li>`).join("")}</ul>` : ""}
    </div></div>
    <h2>Change plan</h2>
    ${(d.changeSets || []).map(changeSetCard).join("") || '<p class="meta">None recorded.</p>'}
  `;
  document.querySelectorAll(".card > button").forEach(b => b.addEventListener("click", () => {
    const card = b.parentElement;
    card.classList.toggle("openCard");
    b.setAttribute("aria-expanded", card.classList.contains("openCard") ? "true" : "false");
  }));
  document.title = `Spec: ${d.title}`;
}
render();
</script>
</body>
</html>
