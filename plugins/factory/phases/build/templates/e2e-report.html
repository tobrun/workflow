<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E2E Report</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1b1b18;
    --muted: #6b6b63;
    --border: #e4e2dc;
    --accent: #b34700;
    --pass-bg: #e6f4ea;
    --pass-fg: #1e7a34;
    --fail-bg: #fbe9e7;
    --fail-fg: #b3261e;
    --code-bg: #f0efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --bg: #16151a;
      --panel: #201f26;
      --text: #ecebe6;
      --muted: #9c9b94;
      --border: #34333c;
      --accent: #ff9a5a;
      --pass-bg: #133721;
      --pass-fg: #6fd991;
      --fail-bg: #3a1a17;
      --fail-fg: #ff8a80;
      --code-bg: #29282f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a; --panel: #201f26; --text: #ecebe6; --muted: #9c9b94; --border: #34333c;
    --accent: #ff9a5a; --pass-bg: #133721; --pass-fg: #6fd991; --fail-bg: #3a1a17; --fail-fg: #ff8a80;
    --code-bg: #29282f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 28px clamp(16px, 4vw, 48px) 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0 0 4px; font-size: 1.4rem; }
  header .sub { color: var(--muted); font-size: 0.9rem; }
  #theme-toggle {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.85rem;
  }
  main { padding: 20px clamp(16px, 4vw, 48px) 60px; max-width: 960px; margin: 0 auto; }
  .summary-banner {
    display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 28px;
  }
  .summary-banner .stat { display: flex; flex-direction: column; }
  .summary-banner .stat .n { font-size: 1.6rem; font-weight: 600; }
  .summary-banner .stat .l { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-banner .stat.pass .n { color: var(--pass-fg); }
  .summary-banner .stat.fail .n { color: var(--fail-fg); }
  .kind-badge {
    margin-left: auto; font-size: 0.75rem; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .scenario {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    margin-bottom: 20px; overflow: hidden;
  }
  .scenario-head {
    padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .scenario.open .scenario-head { border-bottom-color: var(--border); }
  .status-pill { font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .status-pill.pass { background: var(--pass-bg); color: var(--pass-fg); }
  .status-pill.fail { background: var(--fail-bg); color: var(--fail-fg); }
  .scenario-head .title { font-weight: 600; flex: 1; }
  .scenario-head .dur { color: var(--muted); font-size: 0.8rem; }
  .scenario-body { padding: 4px 18px 18px; display: none; }
  .scenario.open .scenario-body { display: block; }
  .gwt { display: grid; grid-template-columns: 70px 1fr; gap: 4px 12px; margin: 12px 0 18px; font-size: 0.92rem; }
  .gwt dt { color: var(--muted); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; padding-top: 2px; }
  .gwt dd { margin: 0; }
  h3.section-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 10px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .shot { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  .shot img { width: 100%; display: block; }
  .shot .caption { padding: 8px 10px; font-size: 0.82rem; color: var(--muted); }
  table.dms { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 10px; }
  table.dms th, table.dms td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.dms th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  table.dms code, pre.logs { background: var(--code-bg); border-radius: 6px; }
  table.dms code { padding: 2px 5px; }
  pre.logs { padding: 10px 12px; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="report-title">E2E Report</h1>
    <div class="sub" id="report-sub"></div>
  </div>
  <button id="theme-toggle" type="button">Toggle theme</button>
</header>

<main>
  <div class="summary-banner" id="summary-banner"></div>
  <div id="scenarios"></div>
</main>

<script>
/* E2E_DATA_START - replace everything between these two markers with the real e2e report data */
const E2E_DATA = {
  title: "Sample Plan",
  planName: "sample-plan",
  generatedAt: "2026-01-01T00:00:00Z",
  kind: "non-frontend",
  scenarios: [
    {
      id: "sample-1",
      title: "Replace this with a real captured scenario",
      given: "...", when: "...", then: "...",
      status: "pass",
      screenshots: [],
      dataModelState: [],
      logsOrOutput: "",
      durationMs: 0
    }
  ],
  summary: { total: 1, passed: 1, failed: 0 }
};
/* E2E_DATA_END */

(function render() {
  const d = E2E_DATA;
  document.title = d.title ? d.title + " - E2E Report" : "E2E Report";
  document.getElementById("report-title").textContent = document.title;
  document.getElementById("report-sub").textContent =
    (d.planName ? d.planName + " - " : "") + (d.generatedAt ? "generated " + d.generatedAt : "");

  const banner = document.getElementById("summary-banner");
  const s = d.summary || { total: 0, passed: 0, failed: 0 };
  banner.innerHTML =
    stat(s.total, "Scenarios", "") +
    stat(s.passed, "Passed", "pass") +
    stat(s.failed, "Failed", "fail") +
    '<span class="kind-badge">' + escapeHtml(d.kind || "") + '</span>';

  const container = document.getElementById("scenarios");
  const scenarios = d.scenarios || [];
  if (!scenarios.length) {
    container.innerHTML = '<div class="empty-state">No scenarios captured yet.</div>';
    return;
  }
  container.innerHTML = scenarios.map(renderScenario).join("");
  container.querySelectorAll(".scenario-head").forEach(function (head) {
    head.addEventListener("click", function () {
      head.parentElement.classList.toggle("open");
    });
  });
  var firstFail = container.querySelector(".scenario:has(.status-pill.fail)");
  (firstFail || container.querySelector(".scenario")).classList.add("open");

  function stat(n, label, cls) {
    return '<div class="stat ' + cls + '"><span class="n">' + n + '</span><span class="l">' + label + '</span></div>';
  }

  function renderScenario(sc) {
    var isFrontend = d.kind === "frontend";
    var shots = sc.screenshots || [];
    var dms = sc.dataModelState || [];
    var body = "";

    body += '<dl class="gwt">' +
      '<dt>Given</dt><dd>' + escapeHtml(sc.given || "") + '</dd>' +
      '<dt>When</dt><dd>' + escapeHtml(sc.when || "") + '</dd>' +
      '<dt>Then</dt><dd>' + escapeHtml(sc.then || "") + '</dd>' +
      '</dl>';

    if (isFrontend && shots.length) {
      body += '<h3 class="section-label">Screenshots</h3><div class="shots">' +
        shots.map(function (sh) {
          return '<div class="shot"><img src="' + sh.dataUri + '" alt="' + escapeHtml(sh.caption || sh.step || "") + '" />' +
            '<div class="caption">' + escapeHtml(sh.step || "") + (sh.caption ? " - " + escapeHtml(sh.caption) : "") + '</div></div>';
        }).join("") + '</div>';
    }

    if (dms.length) {
      body += '<h3 class="section-label">Data model state</h3><table class="dms"><thead><tr>' +
        '<th>Step</th><th>Entity</th><th>Before</th><th>After</th></tr></thead><tbody>' +
        dms.map(function (row) {
          return '<tr><td>' + escapeHtml(row.step || "") + (row.caption ? "<br><span style=\"color:var(--muted)\">" + escapeHtml(row.caption) + "</span>" : "") + '</td>' +
            '<td><code>' + escapeHtml(row.entity || "") + '</code></td>' +
            '<td>' + renderValue(row.before) + '</td>' +
            '<td>' + renderValue(row.after) + '</td></tr>';
        }).join("") + '</tbody></table>';
    }

    if (sc.logsOrOutput) {
      body += '<h3 class="section-label">Output</h3><pre class="logs">' + escapeHtml(sc.logsOrOutput) + '</pre>';
    }

    return '<div class="scenario">' +
      '<div class="scenario-head">' +
      '<span class="status-pill ' + (sc.status === "fail" ? "fail" : "pass") + '">' + (sc.status === "fail" ? "Fail" : "Pass") + '</span>' +
      '<span class="title">' + escapeHtml(sc.title || sc.id || "") + '</span>' +
      (sc.durationMs ? '<span class="dur">' + sc.durationMs + ' ms</span>' : "") +
      '</div>' +
      '<div class="scenario-body">' + body + '</div>' +
      '</div>';
  }

  function renderValue(v) {
    if (v === undefined || v === null) return '<span style="color:var(--muted)">-</span>';
    if (typeof v === "object") return '<code>' + escapeHtml(JSON.stringify(v)) + '</code>';
    return escapeHtml(String(v));
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();

(function theme() {
  const saved = localStorage.getItem("e2e-report-theme");
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme-toggle").addEventListener("click", function () {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    if (next) localStorage.setItem("e2e-report-theme", next);
    else localStorage.removeItem("e2e-report-theme");
  });
})();
</script>
</body>
</html>
